name: Java CI

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
        cache: 'gradle'
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Fetch LibGui from its GitHub release
      # LibGui's maven (server.bbkr.space) is offline, so take the jar from the official GitHub release instead
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p libs
        echo "Files on the LibGui 11.1.0 release:"
        gh release view 11.1.0 -R CottonMC/LibGui --json assets -q '.assets[].name'
        mkdir -p /tmp/libgui
        gh release download 11.1.0 -R CottonMC/LibGui -D /tmp/libgui -p '*.jar'
        rm -f /tmp/libgui/*-sources*.jar /tmp/libgui/*-javadoc*.jar /tmp/libgui/*-dev*.jar
        ls -la /tmp/libgui
        cp "$(ls /tmp/libgui/*.jar | head -n 1)" "libs/LibGui-11.1.0+1.21.jar"
        ls -la libs
    - name: Build artifacts
      run: |
        chmod +x ./gradlew
        ./gradlew build
    - name: Cleanup Gradle Cache
    # Remove some files from the Gradle cache, so they aren't cached by GitHub Actions.
    # Restoring these files from a GitHub Actions cache might cause problems for future builds.
      run: |
        rm -f ~/.gradle/caches/modules-2/modules-2.lock
        rm -f ~/.gradle/caches/modules-2/gc.properties
    - uses: actions/upload-artifact@v4
      with:
        name: mahjongcraft-artifacts-${{ github.run_number }}
        path: build/libs

  # Shandalar is a separate Fabric 1.21.1 mod with its own Gradle project in shandalar-mod/,
  # so it builds alongside MahjongCraft and produces its own jar.
  shandalar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shandalar-mod

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
    - name: Duel engine smoke test (AI vs AI)
      run: |
        mkdir -p /tmp/engine-out
        javac -d /tmp/engine-out $(find src/main/java/com/shandalar/engine -name '*.java')
        java -cp /tmp/engine-out com.shandalar.engine.Simulate src/main/resources/data/shandalar/cards.json 200 /tmp/engine-sample.log
    - name: Build Shandalar
      run: |
        chmod +x ./gradlew
        # Loom sometimes fails to set up Minecraft from a half-written cache or a dropped download;
        # if so, wipe Loom's caches and try once more from scratch.
        ./gradlew build --stacktrace || {
          echo "First build failed; clearing Loom caches and retrying"
          ./gradlew --stop || true
          rm -rf ~/.gradle/caches/fabric-loom .gradle build
          ./gradlew build --stacktrace --refresh-dependencies
        }
    - uses: actions/upload-artifact@v4
      with:
        name: shandalar-artifacts-${{ github.run_number }}
        path: shandalar-mod/build/libs

  # Table Cards: Yu-Gi-Oh! and Pokemon TCG at the mahjong table (Fabric add-on, needs MahjongCraft
  # installed at runtime). Its own Gradle project in tablecards-mod/.
  tablecards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tablecards-mod

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
    - name: Card engine tests with real cards (bot vs bot, both games)
      run: |
        mkdir -p /tmp/tc-engine /tmp/tc-data
        javac -d /tmp/tc-engine $(find src/main/java/com/tablecards/engine -name '*.java')
        # the game only uses real cards, so the test downloads them like the mod does
        if curl -sSfL --max-time 300 -A "TableCards build test" -o /tmp/tc-data/cardinfo.json https://db.ygoprodeck.com/api/v7/cardinfo.php \
           && git clone -q --depth 1 https://github.com/PokemonTCG/pokemon-tcg-data /tmp/tc-data/ptcg; then
          java -cp /tmp/tc-engine com.tablecards.engine.ImportFiles ygo /tmp/tc-data/cardinfo.json /tmp/tc-data/ygo.json
          java -cp /tmp/tc-engine com.tablecards.engine.ImportFiles ptcg /tmp/tc-data/ptcg /tmp/tc-data/ptcg.json
          java -cp /tmp/tc-engine com.tablecards.engine.Simulate 300 both /tmp/tc-data/ygo.json /tmp/tc-data/ptcg.json
        else
          echo "::warning::Couldn't download the card databases, so the engine test was skipped"
        fi
    - name: Build Table Cards
      run: |
        chmod +x ./gradlew
        # Loom sometimes fails to set up Minecraft from a half-written cache or a dropped download;
        # if so, wipe Loom's caches and try once more from scratch.
        ./gradlew build --stacktrace || {
          echo "First build failed; clearing Loom caches and retrying"
          ./gradlew --stop || true
          rm -rf ~/.gradle/caches/fabric-loom .gradle build
          ./gradlew build --stacktrace --refresh-dependencies
        }
    - uses: actions/upload-artifact@v4
      with:
        name: tablecards-artifacts-${{ github.run_number }}
        path: tablecards-mod/build/libs
